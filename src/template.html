<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
</head>
<body>
    <nav>
        <ul id="default">
            <li>
                <button id="today">Today</button>
            </li>
            <li>
                <button id="high-priority">High Priority</button>
            </li>
            <li>
                <button id="planned">Planned</button>
            </li>
            <li>
                <button id="tasks">Tasks</button>
            </li>
        </ul>
        <ul id="projects"></ul>
        <button id="add-project">New Project</button>
    </nav>
    <div id="todos">
        <div id="project-title">
            <h1></h1>
        </div>
        <div id="todos-scroll">
            <ul id="pending"></ul>
            <h2>Completed</h2>
            <ul id="completed"></ul>
        </div>
        <div id="add-todo">
            <button id="add-todo-button">+</button>
            <input type="text" placeholder="Add a todo" id="add-todo-input">
        </div>
    </div>
    <div id="todo-details"></div>
</body>
</html>
